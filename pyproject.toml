[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-analyzer"
version = "0.7.0"
description = "Portfolio-aware stock research, validation, backtesting, and persistent paper-trading lab"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
