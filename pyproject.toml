[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-analyzer"
version = "2.0.0"
description = "Free local-first stock research, strategy backtesting, and paper trading with SQLite"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
