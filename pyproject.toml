[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-analyzer"
version = "2.1.1"
description = "Personal TradingView-style Streamlit charting, strategy backtests and paper practice"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
