name: Publish v1 Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish v1.0.0 tag and GitHub release once
        if: steps.version.outputs.version == '1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 release already exists; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse v1.0.0 >/dev/null 2>&1; then
            git tag -a v1.0.0 -m "QuantEdge v1.0.0"
            git push origin v1.0.0
          fi
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "QuantEdge v1.0.0" \
            --notes-file RELEASE_NOTES_v1.0.md
