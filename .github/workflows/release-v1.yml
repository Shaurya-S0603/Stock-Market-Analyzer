name: Publish v1 Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish v1 tag and GitHub release once
        if: startsWith(steps.version.outputs.version, '1.')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG release already exists; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "QuantEdge $TAG"
            git push origin "$TAG"
          fi

          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "QuantEdge $TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "QuantEdge $TAG" --generate-notes
          fi
