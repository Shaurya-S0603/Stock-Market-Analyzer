name: V3 Full-Stack Foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fastapi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install analytical engine and API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r apps/api/requirements.txt
      - name: API contract and historical invariants
        run: |
          python -m compileall -q apps/api src/stockmarket/workspace/demo_data.py
          pytest -q tests/test_v3_api_foundation.py

  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck Next.js
        working-directory: apps/web
        run: npm run typecheck
      - name: Build production website
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  end-to-end:
    needs: [fastapi, nextjs]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qe
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: quantedge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qe -d quantedge_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://qe:ci_local_only@127.0.0.1:5432/quantedge_test
      REDIS_URL: redis://127.0.0.1:6379/0
      FASTAPI_INTERNAL_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install both runtimes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r apps/api/requirements.txt
          npm install --prefix apps/web --no-audit --no-fund
      - name: Verify PostgreSQL and Redis connections (read-only)
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from apps.api.main import app
          response = TestClient(app).get("/api/v1/health/dependencies")
          assert response.status_code == 200, response.text
          assert response.json()["dependencies"] == {"postgres": "connected", "redis": "connected"}, response.text
          print("PASS PostgreSQL SELECT 1 and Redis PING")
          PY
      - name: Start real FastAPI and built Next.js servers
        run: |
          npm run build --prefix apps/web
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > /tmp/quantedge-api.log 2>&1 &
          (cd apps/web && npm run start -- --port 3000) > /tmp/quantedge-next.log 2>&1 &
      - name: Execute HTTP traffic through both services
        run: |
          python scripts/v3_smoke.py --base http://127.0.0.1:3000
      - name: Print server logs on failure
        if: failure()
        run: |
          tail -100 /tmp/quantedge-api.log || true
          tail -100 /tmp/quantedge-next.log || true
