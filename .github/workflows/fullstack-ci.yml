name: V3 Full-stack Connectivity

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  web-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quantedge
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: quantedge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantedge -d quantedge"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://quantedge:ci-test-only-password@127.0.0.1:5432/quantedge
      REDIS_URL: redis://127.0.0.1:6379/0
      FASTAPI_INTERNAL_URL: http://127.0.0.1:8000
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend and existing engines
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r apps/api/requirements.txt

      - name: Verify FastAPI contracts and bounds
        run: python -m pytest -q tests/test_v3_api_foundation.py tests/test_v3_historical_research.py

      - name: Install Next.js frontend
        run: npm install --prefix apps/web --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --prefix apps/web

      - name: Build production Next.js app
        run: npm run build --prefix apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Launch both services and verify real HTTP connectivity
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 >/tmp/qe-fastapi.log 2>&1 &
          api_pid=$!
          (cd apps/web && npm run start -- --port 3000 >/tmp/qe-next.log 2>&1) &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for trial in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null &&
               curl -fsS http://127.0.0.1:3000/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          python scripts/v3_http_connectivity.py
