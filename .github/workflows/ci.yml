name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r apps/api/requirements.txt

      - name: Compile sources
        run: python -m compileall -q app.py workspace_worker.py apps/api src tests scripts

      - name: Run regression tests
        run: |
          mkdir -p artifacts
          pytest -q --junitxml=artifacts/pytest-results.xml

      - name: Generate automated feature verification evidence
        run: python scripts/verify_features.py artifacts/pytest-results.xml --output artifacts/feature_evidence.json

      - name: Retain full test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantedge-verification-py-${{ matrix.python-version }}
          path: artifacts/
          retention-days: 30
