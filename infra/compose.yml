# LOCAL DEVELOPMENT ONLY. Never reuse these sample credentials publicly.
name: quantedge-v3-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quantedge
      POSTGRES_USER: quantedge
      POSTGRES_PASSWORD: local-dev-only-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantedge -d quantedge"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://quantedge:local-dev-only-password@postgres:5432/quantedge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FASTAPI_INTERNAL_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
